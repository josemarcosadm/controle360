name: keep-supabase-awake

on:
  schedule:
    - cron: "30 11 */2 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping no banco de dados
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: sb_publishable_fYbg7I5KSkyRSOB-33tW-Q_OiyHW0fd" \
            -H "Authorization: Bearer sb_publishable_fYbg7I5KSkyRSOB-33tW-Q_OiyHW0fd" \
            "https://jgcrflgumicitnsxxhpy.supabase.co/rest/v1/lancamentos?select=id&limit=1")
          echo "Resposta do servidor: HTTP $code"
          if [ "$code" = "000" ]; then echo "Servidor sem resposta."; exit 1; fi
          echo "OK — servidor ativo."
